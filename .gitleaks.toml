# line, or add a scoped [[allowlists]] entry below with a description saying
# why the match is not a real secret (see ploy-world's .gitleaks.toml for
# examples of scoped allowlists).
title = "tenant-starter-astro gitleaks config"

[extend]
useDefault = true
